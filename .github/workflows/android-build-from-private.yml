name: android-build-from-private

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private source ref/branch/commit"
        required: true
        default: "main"
      artifact_name:
        description: "Artifact name"
        required: true
        default: "a-class-edge-apk"
      run_benchmark:
        description: "Run 7-class benchmark evaluation"
        required: true
        default: "true"
      benchmark_per_class:
        description: "Benchmark samples per class"
        required: true
        default: "100"
      run_mlkit_benchmark:
        description: "Run MLKit runtime benchmark on Android emulator"
        required: true
        default: "true"
      mlkit_max_samples:
        description: "Max samples for MLKit emulator benchmark (0=all)"
        required: true
        default: "700"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Setup SSH for private source clone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SOURCE_REPO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private source repository
        shell: bash
        env:
          SOURCE_REPO: FuChuZhao/a-class-edge-source
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SOURCE_REF" "git@github.com:${SOURCE_REPO}.git" source

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK from private script
        shell: bash
        run: |
          set -euo pipefail
          cd source
          chmod +x tool/ci/build_apk.sh
          tool/ci/build_apk.sh

      - name: Setup Python
        if: ${{ github.event.inputs.run_benchmark == 'true' || github.event.inputs.run_mlkit_benchmark == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install emulator runtime deps
        if: ${{ github.event.inputs.run_mlkit_benchmark == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Run benchmark evaluation
        if: ${{ github.event.inputs.run_benchmark == 'true' }}
        shell: bash
        env:
          BENCHMARK_PER_CLASS: ${{ github.event.inputs.benchmark_per_class }}
          RUN_MLKIT_BENCHMARK: ${{ github.event.inputs.run_mlkit_benchmark }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-python-version-warning Pillow
          cd source
          chmod +x tool/benchmark/build_hf_benchmark_v1.sh tool/benchmark/run_benchmark_eval.sh
          KEEP_IMAGES_ARG=""
          if [[ "$RUN_MLKIT_BENCHMARK" == "true" ]]; then
            KEEP_IMAGES_ARG="--keep-images"
          fi
          tool/benchmark/run_benchmark_eval.sh --per-class "$BENCHMARK_PER_CLASS" --out-dir out/benchmark $KEEP_IMAGES_ARG

      - name: Run MLKit benchmark on emulator
        if: ${{ github.event.inputs.run_mlkit_benchmark == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BENCHMARK_PER_CLASS: ${{ github.event.inputs.benchmark_per_class }}
          RUN_BENCHMARK: ${{ github.event.inputs.run_benchmark }}
          MLKIT_MAX_SAMPLES: ${{ github.event.inputs.mlkit_max_samples }}
        with:
          api-level: 29
          arch: x86
          profile: Nexus 6
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -no-window
          script: |
            set -euo pipefail
            cd source
            chmod +x tool/benchmark/build_hf_benchmark_v1.sh

            if [[ "$RUN_BENCHMARK" != "true" ]]; then
              tool/benchmark/build_hf_benchmark_v1.sh --download --per-class "$BENCHMARK_PER_CLASS" --out-dir out/benchmark
            fi

            python3 tool/benchmark/build_mlkit_eval_manifest.py \
              --benchmark-manifest out/benchmark/benchmark_manifest.csv \
              --output out/benchmark/mlkit_eval_manifest.json \
              --max-samples "$MLKIT_MAX_SAMPLES"

            DEVICE_ROOT="/sdcard/Android/data/com.okret.aclassedge.debug/files/okret_benchmark"
            adb shell "rm -rf $DEVICE_ROOT && mkdir -p $DEVICE_ROOT"
            adb push out/benchmark/images "$DEVICE_ROOT/images"
            adb push out/benchmark/mlkit_eval_manifest.json "$DEVICE_ROOT/mlkit_eval_manifest.json"

            ./gradlew --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.okret.aclassedge.benchmark.MlKitRouterBenchmarkInstrumentedTest \
              -Pandroid.testInstrumentationRunnerArguments.okretBenchmarkManifest="$DEVICE_ROOT/mlkit_eval_manifest.json" \
              -Pandroid.testInstrumentationRunnerArguments.okretBenchmarkImagesRoot="$DEVICE_ROOT" \
              -Pandroid.testInstrumentationRunnerArguments.okretBenchmarkOutDir="$DEVICE_ROOT/out"

            mkdir -p out/mlkit-benchmark
            adb pull "$DEVICE_ROOT/out" out/mlkit-benchmark/device || true

      - name: Upload artifact (minimal retention)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: source/out/apk/*.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Upload unit test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: a-class-edge-unit-test-report
          path: source/out/test-report/**
          if-no-files-found: warn
          retention-days: 1

      - name: Upload benchmark report
        if: ${{ always() && github.event.inputs.run_benchmark == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: a-class-edge-benchmark-report
          path: |
            source/out/benchmark/benchmark_manifest.csv
            source/out/benchmark/eval/**
          if-no-files-found: warn
          retention-days: 1

      - name: Upload MLKit benchmark report
        if: ${{ always() && github.event.inputs.run_mlkit_benchmark == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: a-class-edge-mlkit-benchmark-report
          path: |
            source/out/benchmark/mlkit_eval_manifest.json
            source/out/mlkit-benchmark/**
            source/app/build/reports/androidTests/connected/**
            source/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 1
