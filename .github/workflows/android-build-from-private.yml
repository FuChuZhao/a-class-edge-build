name: android-build-from-private

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private source ref/branch/commit"
        required: true
        default: "main"
      artifact_name:
        description: "Artifact name"
        required: true
        default: "a-class-edge-apk"
      run_benchmark:
        description: "Run 7-class benchmark evaluation"
        required: true
        default: "true"
      benchmark_per_class:
        description: "Benchmark samples per class"
        required: true
        default: "100"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Setup SSH for private source clone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SOURCE_REPO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone private source repository
        shell: bash
        env:
          SOURCE_REPO: FuChuZhao/a-class-edge-source
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SOURCE_REF" "git@github.com:${SOURCE_REPO}.git" source

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK from private script
        shell: bash
        run: |
          set -euo pipefail
          cd source
          chmod +x tool/ci/build_apk.sh
          tool/ci/build_apk.sh

      - name: Setup Python
        if: ${{ github.event.inputs.run_benchmark == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run benchmark evaluation
        if: ${{ github.event.inputs.run_benchmark == 'true' }}
        shell: bash
        env:
          BENCHMARK_PER_CLASS: ${{ github.event.inputs.benchmark_per_class }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-python-version-warning Pillow
          cd source
          chmod +x tool/benchmark/build_hf_benchmark_v1.sh tool/benchmark/run_benchmark_eval.sh
          tool/benchmark/run_benchmark_eval.sh --per-class "$BENCHMARK_PER_CLASS" --out-dir out/benchmark

      - name: Upload artifact (minimal retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: source/out/apk/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        with:
          name: a-class-edge-unit-test-report
          path: source/out/test-report/**
          if-no-files-found: warn
          retention-days: 1

      - name: Upload benchmark report
        if: ${{ github.event.inputs.run_benchmark == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: a-class-edge-benchmark-report
          path: |
            source/out/benchmark/benchmark_manifest.csv
            source/out/benchmark/eval/**
          if-no-files-found: warn
          retention-days: 1
